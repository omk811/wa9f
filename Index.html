  <script>
    const lesson = document.getElementById('lesson');
    const quiz = document.getElementById('quiz');
    const result = document.getElementById('result');
    const questions = [...document.querySelectorAll('.quiz-question')];
    const nextButton = document.getElementById('next-button');
    let current = 0, score = 0;
    function showQuestion() {
      questions.forEach((q,i) => q.hidden = i !== current);
      document.getElementById('progress').textContent = `${current + 1} / ${questions.length}`;
      document.getElementById('progress-bar').style.width = `${(current + 1) / questions.length * 100}%`;
      nextButton.hidden = true;
      document.getElementById('next-label').hidden = current === questions.length - 1;
      document.getElementById('finish-label').hidden = current !== questions.length - 1;
    }
    document.getElementById('start-button').addEventListener('click', () => {
      lesson.hidden = true; quiz.hidden = false; showQuestion(); quiz.scrollIntoView({behavior:'smooth',block:'start'});
    });
    questions.forEach(question => {
      question.querySelectorAll('.choice').forEach(button => button.addEventListener('click', () => {
        if (!question.querySelector('.feedback').hidden) return;
        const correct = button.dataset.correct === 'true';
        if (correct) score++;
        question.querySelectorAll('.choice').forEach(choice => {
          choice.disabled = true;
          if (choice.dataset.correct === 'true') choice.classList.add('correct');
        });
        if (!correct) button.classList.add('incorrect');
        const feedback = question.querySelector('.feedback');
        feedback.hidden = false;
        feedback.querySelector('.correct-message').hidden = !correct;
        feedback.querySelector('.wrong-message').hidden = correct;
        nextButton.hidden = false;
      }));
    });
    nextButton.addEventListener('click', () => {
      if (current < questions.length - 1) {
        current++; showQuestion(); quiz.scrollIntoView({behavior:'smooth',block:'start'});
      } else {
        quiz.hidden = true; result.hidden = false;
        document.getElementById('score').textContent = `${score} / ${questions.length}`;
        result.scrollIntoView({behavior:'smooth',block:'start'});
      }
    });
    document.getElementById('retry-button').addEventListener('click', () => {
      score = 0; current = 0;
      questions.forEach(q => {
        q.querySelectorAll('.choice').forEach(choice => {
          choice.disabled = false; choice.classList.remove('correct','incorrect');
        });
        q.querySelector('.feedback').hidden = true;
        q.querySelector('.correct-message').hidden = true;
        q.querySelector('.wrong-message').hidden = true;
      });
      result.hidden = true; quiz.hidden = false; showQuestion();
      quiz.scrollIntoView({behavior:'smooth',block:'start'});
    });
  </script>
